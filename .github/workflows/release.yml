name: Release

# Fires when you push a tag like v0.2.0
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write # needed to create the GitHub Release

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS – Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            arch_label: x86_64
          # macOS – Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            arch_label: aarch64
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch_label: x86_64
          # Linux
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch_label: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Linux system deps (WebKit2GTK, etc.) ──────────────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Node ──────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Rust ──────────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache Rust build artifacts so subsequent runs are fast
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ── Install JS deps ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Build & bundle via Tauri ──────────────────────────────────────────
      # tauri-action handles: npm run build, cargo build --release,
      # icon generation, and bundling (.dmg / .msi / .deb / .AppImage).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code-signing (optional – remove if you don't have certs) ──
          # APPLE_CERTIFICATE:            ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD:   ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY:       ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID:                     ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD:               ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID:                ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }} # e.g.  v0.2.0
          releaseName: "Folio ${{ github.ref_name }}"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true # ← flip to false to publish automatically
          prerelease: false
          args: --target ${{ matrix.target }}
